<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ainhoa · Devoluciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF7F1; --ink:#111111; --caramelo:#B87F45;
    --green:#4C7A5E; --tan:#A68A64; --gray:#8A8A8A; --borde:#EAE3D5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:Georgia,serif; background:var(--cream); color:var(--ink)}
  button,input{font-family:Georgia,serif}
  .display{font-family:'Cormorant Garamond',Georgia,serif}

  header{background:var(--ink); padding:34px 20px 26px; text-align:center}
  header .marca{color:#fff; font-size:34px; letter-spacing:6px; font-weight:500}
  header .sub{color:#ffffffb0; font-size:11px; letter-spacing:3px; margin-top:6px; text-transform:uppercase}

  .wrap{max-width:440px; margin:0 auto; padding:22px 18px 60px}

  .card{width:100%; text-align:left; padding:18px; border-radius:16px; border:1px solid var(--borde);
        background:#fff; cursor:pointer; margin-bottom:10px; display:block}
  .card:active{background:#F5F0E6}
  .landing{display:flex; align-items:center; gap:16px}
  .landing .ic{width:26px; height:26px; display:flex; align-items:center; justify-content:center; flex:0 0 26px}
  .landing .tx{flex:1}
  .landing .t{font-size:17px}
  .landing .s{font-size:11.5px; color:var(--tan); margin-top:2px}

  .tag{display:inline-block; padding:4px 12px; border-radius:999px; font-size:10.5px;
       letter-spacing:1px; text-transform:uppercase; white-space:nowrap}

  .buscador{width:100%; padding:16px; font-size:17px; border:1px solid #ddd6c8;
            border-radius:14px; margin-bottom:12px; background:#fff}
  .buscador:focus{outline:none; border-color:var(--tan)}

  .orden{position:relative; margin-bottom:16px}
  .orden .btn{width:100%; display:flex; align-items:center; justify-content:space-between;
              padding:12px 16px; border-radius:14px; border:1px solid var(--borde);
              background:#fff; color:var(--ink); font-size:13.5px; text-align:left}
  .orden .btn .et{color:var(--tan)}
  .orden .menu{position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:20; background:#fff;
               border:1px solid var(--borde); border-radius:14px; overflow:hidden;
               box-shadow:0 8px 24px rgba(17,17,17,.10)}
  .orden .menu button{width:100%; text-align:left; padding:13px 16px; font-size:13.5px;
                      border:none; border-top:1px solid #F2ECE0; background:#fff; color:var(--ink)}
  .orden .menu button:first-child{border-top:none}
  .orden .menu button.on{background:#F5F0E6; color:var(--caramelo)}

  .prenda{background:#fff; border:1px solid var(--borde); border-radius:16px; padding:16px; margin-bottom:10px}
  .prenda.busy{opacity:.55; pointer-events:none}
  .fila{display:flex; justify-content:space-between; align-items:center; gap:8px}
  .cod{color:var(--caramelo); font-weight:600}
  .prod{font-size:14.5px; margin:6px 0 2px; line-height:1.35}
  .prov{font-size:12px; color:var(--tan)}
  .fecha{font-size:11px; color:#bbb; margin-top:2px; margin-bottom:12px}
  .nota{background:#8A8A8A18; border-radius:10px; padding:8px 10px; font-size:12.5px; color:#555; margin-bottom:10px}

  .estados{display:flex; gap:6px}
  .eb{flex:1; padding:11px 3px; border-radius:10px; font-size:11.5px; line-height:1.2; background:#fff}
  .stock-btn{width:100%; margin-top:6px; padding:8px; border-radius:10px; border:1px solid var(--borde);
             background:transparent; color:#999; font-size:11px}

  .campo{margin-top:10px}
  .campo .titulo{font-size:12.5px; color:#666; margin-bottom:6px}
  .campo input{width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; font-size:13px; margin-bottom:6px}
  .campo .acciones{display:flex; gap:6px}
  .campo .guardar{flex:2; padding:9px; border-radius:10px; border:none; background:var(--gray); color:#fff; font-size:12.5px}
  .campo .cancelar{flex:1; padding:9px; border-radius:10px; border:1px solid #ddd; background:#fff; color:#666; font-size:12.5px}

  .acc{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .acc button{flex:1; padding:10px; border-radius:10px; font-size:13px; border:1px solid #ddd; background:#fff; color:var(--ink)}
  .acc button.wa{flex:1 1 100%; border:none; background:var(--green); color:#fff}
  .acc button.prim{border:none; background:var(--green); color:#fff}

  .sel{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid #F2ECE0; font-size:13px}
  .sel .mk{width:20px; height:20px; border-radius:6px; border:1px solid #ddd6c8; flex:0 0 20px;
           display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff}
  .sel.on .mk{background:var(--caramelo); border-color:var(--caramelo)}
  .mapa-mueble{margin-bottom:18px}
  .mapa-mueble h3{font-size:12.5px; letter-spacing:1.5px; color:var(--tan);
                  text-transform:uppercase; margin:0 0 8px; font-weight:normal}
  .lugares{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .lugar{cursor:pointer; border:1px solid var(--borde); border-radius:14px; padding:12px; background:#fff; min-height:74px}
  .lugar.libre{background:transparent; border-style:dashed}
  .lugar .n{font-size:13px; margin-bottom:4px}
  .lugar .c{font-size:11px; color:var(--tan)}
  .lugar .p{font-size:11.5px; color:var(--caramelo); margin-top:4px; line-height:1.35}
  .etiqueta{background:#fff; border:1px dashed var(--caramelo); border-radius:16px; padding:18px; text-align:center; margin-bottom:10px}
  .etiqueta .l1{font-size:12px; letter-spacing:2px; color:var(--tan); text-transform:uppercase}
  .etiqueta .l2{font-size:20px; margin:6px 0}
  .etiqueta .l3{font-size:15px; color:var(--caramelo)}
  .vacio{color:#999; text-align:center; padding:24px 0}
  .cargando{text-align:center; color:var(--tan); padding:30px 0}
  .errorbox{background:#fff; border:1px solid var(--borde); border-radius:16px; padding:18px; text-align:center}
  .errorbox button{margin-top:12px; padding:10px 20px; border-radius:10px; border:none; background:var(--ink); color:#fff; font-size:13px}
  .titulo-prov{font-size:16px; font-weight:600; margin-bottom:12px}
  .conteo{font-size:12.5px; color:var(--tan); margin:0 0 12px; letter-spacing:1px}
  .volver{margin-top:8px; background:none; border:none; color:#999; font-size:13px; padding:6px 0}
  .aviso{position:sticky; top:0; z-index:30; color:#fff; text-align:center; padding:10px 16px; font-size:13px}
  .nav{position:sticky; top:0; z-index:25; background:var(--cream); border-bottom:1px solid var(--borde);
       display:flex; justify-content:space-between; align-items:center; padding:10px 18px}
  .nav button{background:none; border:none; color:#777; font-size:14px; padding:6px 2px}
  .nav .inicio{color:var(--caramelo)}
</style>
</head>
<body>

<header>
  <div class="display marca">AINHOA</div>
  <div class="sub">Devoluciones · Gestión interna</div>
</header>
<div id="aviso"></div>
<div id="nav"></div>
<div class="wrap" id="app"></div>

<script>
var API = "https://script.google.com/macros/s/AKfycbyZbEeODB-LF71H32WLSJafEKpl4sQNzMEiNQ2nvxK6LjNc1pmX0NMEbKSi5s7EXk9d/exec";

var CARAMELO = "#B87F45", TAN = "#A68A64", GRAY = "#8A8A8A", GREEN = "#4C7A5E";
var STOCK = "En stock";
var ESTADOS = {
  "Devuelta":            { label: "Devuelta",           color: CARAMELO },
  "Última Oportunidad":  { label: "Última oportunidad", color: TAN },
  "Revisar":             { label: "Revisar",            color: GRAY }
};
var TIPOS = [
  {id:"Devolución preselección",     label:"Devolución preselección",     ayuda:"Lo que no quedó seleccionado al hacer stock"},
  {id:"Devolución fin de temporada", label:"Devolución fin de temporada", ayuda:"Prendas que estuvieron a la venta y se devuelven"},
  {id:"Para hacer stock",            label:"Para hacer stock",            ayuda:"Trajo la bolsa y todavía hay que ingresarla"}
];
function etiquetaTipo(t){
  if(t === "Devolución preselección") return "Preselección";
  if(t === "Devolución fin de temporada") return "Fin de temporada";
  if(t === "Para hacer stock") return "Stock";
  return t || "";
}
function colorTipo(t){
  if(t === "Para hacer stock") return TAN;
  if(t === "Devolución preselección") return GRAY;
  return CARAMELO;
}

function colorEstado(e){
  if(e==="Devuelta") return CARAMELO;
  if(e==="Última Oportunidad") return TAN;
  if(e==="Revisar") return GRAY;
  if(e==="Vendida") return GREEN;
  return TAN;
}

var ORDEN_PROV = [
  {id:"nombre-az",     label:"Nombre A – Z"},
  {id:"nombre-za",     label:"Nombre Z – A"},
  {id:"mas-prendas",   label:"Más prendas primero"},
  {id:"menos-prendas", label:"Menos prendas primero"},
  {id:"ingreso-viejo", label:"Ingreso más antiguo primero"},
  {id:"ingreso-nuevo", label:"Ingreso más reciente primero"}
];
var ORDEN_ITEMS = [
  {id:"original",      label:"Orden original"},
  {id:"ingreso-viejo", label:"Ingreso más antiguo primero"},
  {id:"ingreso-nuevo", label:"Ingreso más reciente primero"}
];

var S = {
  screen:"home",
  resumen:{pendientesAviso:0, pendientesRevision:0},
  provs:[], provQuery:"", ordenProv:"nombre-az", ordenAbierto:false,
  prov:null, items:[], ordenItems:"original",
  codQuery:"", resultados:[], buscando:false,
  grupos:[], revisiones:[],
  depQuery:"", depResultados:[], depBuscando:false,
  ubicaciones:[], mapa:null, moverBolsa:null, origenCarga:"lugar",
  lugarSel:null, nueva:null, provBusq:"", provLista:[], provBuscando:false,
  bolsaCantidad:"",
  guardando:{}, notaAbierta:null, notaTexto:""
};

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fechaCorta(iso){
  if(!iso || iso.length < 10) return iso || "";
  var p = iso.split("-");
  return p[2] + "/" + p[1] + "/" + p[0].slice(2);
}

function api(action, params){
  params = params || {};
  var qs = "action=" + encodeURIComponent(action);
  for(var k in params){
    if(params[k] === undefined || params[k] === null) continue;
    qs += "&" + k + "=" + encodeURIComponent(params[k]);
  }
  return fetch(API + "?" + qs)
    .then(function(r){
      if(!r.ok) throw new Error("No se pudo conectar con el Sheet");
      return r.json();
    })
    .then(function(d){
      if(d.ok === false) throw new Error(d.error || "Error del servidor");
      return d;
    });
}

var avisoTimer = null;
function aviso(texto, tono){
  var el = document.getElementById("aviso");
  el.innerHTML = '<div class="aviso" style="background:' + (tono||GREEN) + '">' + esc(texto) + '</div>';
  if(avisoTimer) clearTimeout(avisoTimer);
  avisoTimer = setTimeout(function(){ el.innerHTML = ""; }, 2800);
}

/* ---------------- iconos ---------------- */
function icono(n){
  var a = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="' + TAN +
          '" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">';
  if(n==="buscar")  return a + '<circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.4" y1="15.4" x2="21" y2="21"/></svg>';
  if(n==="codigo")  return a + '<path d="M12.6 2.8H21v8.4L11.2 21 3 12.8z"/><circle cx="17.1" cy="6.9" r="1.2"/></svg>';
  if(n==="deposito") return a + '<path d="M3 8.5 12 4l9 4.5v7L12 20l-9-4.5z"/><path d="M3 8.5 12 13l9-4.5"/><path d="M12 13v7"/></svg>';
  if(n==="aviso")   return a + '<rect x="4.5" y="3" width="15" height="18" rx="2.2"/><line x1="8.5" y1="8.5" x2="15.5" y2="8.5"/><line x1="8.5" y1="12.3" x2="15.5" y2="12.3"/><line x1="8.5" y1="16.1" x2="12.5" y2="16.1"/></svg>';
  return a + '<path d="M12 3.2 21 20.4H3z"/><line x1="12" y1="10" x2="12" y2="14.4"/><line x1="12" y1="17.2" x2="12" y2="17.3"/></svg>';
}

/* ---------------- carga de datos ---------------- */
function cargarResumen(){
  api("devolResumen").then(function(r){
    S.resumen = {pendientesAviso:r.pendientesAviso, pendientesRevision:r.pendientesRevision};
    if(S.screen === "home") render();
  }).catch(function(){});
}

function cargar(nombre){
  S.cargando = true; S.error = null; render();
  var p;
  if(nombre === "provs")      p = api("devolProveedoras").then(function(r){ S.provs = r.proveedoras; });
  else if(nombre === "items") p = api("devolPrendas", {prov:S.prov.num}).then(function(r){ S.items = r.prendas; });
  else if(nombre === "grupos")p = api("devolPendientes").then(function(r){ S.grupos = r.grupos; });
  else                        p = api("devolRevisiones").then(function(r){ S.revisiones = r.prendas; });
  p.then(function(){ S.cargando = false; render(); })
   .catch(function(e){ S.cargando = false; S.error = e.message; render(); });
}

function cargarUbicaciones(){
  if(S.ubicaciones.length) return Promise.resolve();
  return api("devolBolsaUbicaciones").then(function(r){ S.ubicaciones = r.muebles; })
    .catch(function(e){ aviso("No se pudieron leer las ubicaciones: " + e.message, GRAY); });
}

function cargarMapa(luego){
  S.cargando = true; render();
  return api("devolMapa").then(function(r){
    S.mapa = r; S.cargando = false;
    if(luego) S.screen = luego;
    render();
  }).catch(function(e){ S.cargando = false; render(); aviso(e.message, GRAY); });
}

// Qué bolsas hay hoy en el lugar que estoy mirando.
function bolsasDelLugar(){
  if(!S.mapa || !S.lugarSel) return [];
  var out = [];
  S.mapa.muebles.forEach(function(m){
    m.lugares.forEach(function(l){
      if(l.mueble === S.lugarSel.mueble && l.ubicacion === S.lugarSel.ubicacion) out = l.bolsas;
    });
  });
  return out;
}

function crearBolsaNueva(){
  var n = S.nueva;
  if(!n || !n.prov || !n.tipo || !n.ubicacion){ aviso("Faltan datos de la bolsa", GRAY); return; }
  var params = {prov:n.prov.num, tipo:n.tipo, ubicacion:n.ubicacion, mueble:n.mueble || "", notas:""};
  if(S.bolsaCantidad) params.cantidad = S.bolsaCantidad;
  S.cargando = true; render();
  api("devolBolsaCrear", params).then(function(r){
    aviso("Bolsa de " + r.proveedora + " guardada en " + (r.mueble ? r.mueble + " · " : "") + r.ubicacion);
    S.nueva = null; S.bolsaCantidad = ""; S.ubicaciones = [];
    if(S.origenCarga === "lugar"){ cargarUbicaciones(); cargarMapa("lugar"); }
    else { S.cargando = false; if(S.prov){ S.screen = "itemsProv"; cargar("items"); } else ir("deposito"); }
  }).catch(function(e){
    S.cargando = false; render();
    aviso("No se guardó: " + e.message, GRAY);
  });
}

function entregarBolsa(nro){
  api("devolBolsaEntregar", {bolsa:nro}).then(function(){
    aviso("Bolsa " + nro + " cerrada");
    S.ubicaciones = [];
    if(S.screen === "lugar") cargarMapa("lugar");
    else buscarDeposito(S.depQuery, true);
  }).catch(function(e){ aviso("No se guardó: " + e.message, GRAY); });
}

function entregarTodo(prov, nombre){
  api("devolBolsaEntregarTodo", {prov:prov}).then(function(r){
    aviso(nombre + " retiró sus " + r.cerradas + (r.cerradas===1?" bolsa":" bolsas"));
    S.ubicaciones = [];
    buscarDeposito(S.depQuery, true);
  }).catch(function(e){ aviso("No se guardó: " + e.message, GRAY); });
}

function moverBolsa(ubicacion, mueble){
  api("devolBolsaMover", {bolsa:S.moverBolsa, ubicacion:ubicacion, mueble:mueble || ""}).then(function(r){
    aviso(r.proveedora + ": " + r.antes + " → " + r.ahora);
    S.moverBolsa = null; S.bolsaMueble = null; S.ubicaciones = [];
    if(S.origenCarga === "lugar"){ cargarUbicaciones(); cargarMapa("lugar"); }
    else { S.screen = "deposito"; render(); if(S.depQuery) buscarDeposito(S.depQuery, true); }
  }).catch(function(e){ aviso("No se guardó: " + e.message, GRAY); });
}

var timerProvB = null, provBId = 0;
function buscarProvParaBolsa(q){
  q = String(q || "").trim();
  if(!q){ S.provLista = []; S.provBuscando = false; render(); return; }
  var mio = ++provBId;
  S.provBuscando = true; render();
  api("devolBolsaBuscar", {q:q}).then(function(r){
    if(mio !== provBId) return;
    S.provLista = r.proveedoras; S.provBuscando = false; render();
  }).catch(function(e){
    if(mio !== provBId) return;
    S.provLista = []; S.provBuscando = false; render(); aviso(e.message, GRAY);
  });
}

var timerDep = null, depId = 0;
function buscarDeposito(q, yaCargado){
  q = String(q || "").trim();
  if(q.length < 1){ S.depResultados = []; S.depBuscando = false; render(); return; }
  var mio = ++depId;
  S.depBuscando = !yaCargado; render();
  api("devolBolsaBuscar", {q:q}).then(function(r){
    if(mio !== depId) return;
    S.depResultados = r.proveedoras; S.depBuscando = false; render();
  }).catch(function(e){
    if(mio !== depId) return;
    S.depResultados = []; S.depBuscando = false; render(); aviso(e.message, GRAY);
  });
}

function ir(screen){
  S.screen = screen; S.error = null; S.ordenAbierto = false;
  S.notaAbierta = null; S.notaTexto = "";
  if(screen === "buscarProv"){ S.provQuery = ""; cargar("provs"); return; }
  if(screen === "pendientes"){ cargar("grupos"); return; }
  if(screen === "revision"){ cargar("revisiones"); return; }
  if(screen === "buscarCodigo"){ S.codQuery = ""; S.resultados = []; }
  if(screen === "deposito"){ S.depQuery = ""; S.depResultados = []; }
  if(screen === "cargarMueble"){ S.bolsaMueble = null; cargarUbicaciones().then(render); }
  if(screen === "mapa"){ cargarMapa(); }
  if(screen === "home") cargarResumen();
  render();
}

function actualizarPrenda(codigo, cambios){
  function ap(l){
    for(var i=0;i<l.length;i++){
      if(l[i].codigo === codigo) for(var k in cambios) l[i][k] = cambios[k];
    }
  }
  ap(S.items); ap(S.resultados); ap(S.revisiones);
}

function marcar(codigo, fila, estado, nota){
  if(S.guardando[codigo]) return;
  S.guardando[codigo] = true; render();
  var params = {codigo:codigo, estado:estado, fila:fila};
  if(nota) params.nota = nota;
  api("devolMarcar", params).then(function(r){
    var cambios = {estado:r.estado};
    if(nota) cambios.nota = nota;
    actualizarPrenda(codigo, cambios);
    S.notaAbierta = null; S.notaTexto = "";
    S.guardando[codigo] = false;
    render();
    if(estado === "Revisar") aviso(codigo + " quedó en Pendientes de revisión");
  }).catch(function(e){
    S.guardando[codigo] = false;
    aviso("No se guardó: " + e.message, GRAY);
    render();
  });
}

function yaAvise(num){
  var clave = "prov" + num;
  if(S.guardando[clave]) return;
  S.guardando[clave] = true; render();
  api("devolAvisar", {prov:num}).then(function(){
    S.grupos = S.grupos.filter(function(g){ return String(g.num) !== String(num); });
    S.guardando[clave] = false;
    render();
  }).catch(function(e){
    S.guardando[clave] = false;
    aviso("No se guardó: " + e.message, GRAY);
    render();
  });
}

function mensajeWa(g){
  var lista = g.prendas.map(function(i){ return "• " + i.producto + " (" + i.codigo + ")"; }).join("\n");
  return "¡Hola " + g.nombre + "! 💛 Tenés estas prendas para retirar en Ainhoa:\n\n" +
         lista + "\n\nAvisanos cuándo podés pasar. ¡Gracias!";
}
function copiar(texto){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(function(){ aviso("Mensaje copiado"); })
      .catch(function(){ aviso("No se pudo copiar. Mantené apretado el texto.", GRAY); });
  } else {
    aviso("No se pudo copiar. Mantené apretado el texto.", GRAY);
  }
}

/* ---------------- orden ---------------- */
function provsFiltradas(){
  var q = S.provQuery.trim().toLowerCase();
  var l = S.provs.filter(function(p){
    if(!q) return true;
    return String(p.num).indexOf(q) > -1 || p.nombre.toLowerCase().indexOf(q) > -1;
  });
  var o = S.ordenProv;
  return l.slice().sort(function(a,b){
    if(o==="nombre-za")     return b.nombre.localeCompare(a.nombre);
    if(o==="mas-prendas")   return b.cantidad - a.cantidad;
    if(o==="menos-prendas") return a.cantidad - b.cantidad;
    if(o==="ingreso-viejo") return String(a.primerIngreso).localeCompare(String(b.primerIngreso));
    if(o==="ingreso-nuevo") return String(b.primerIngreso).localeCompare(String(a.primerIngreso));
    return a.nombre.localeCompare(b.nombre);
  });
}
function itemsOrdenados(){
  if(S.ordenItems === "original") return S.items;
  var signo = S.ordenItems === "ingreso-nuevo" ? -1 : 1;
  return S.items.slice().sort(function(a,b){
    return String(a.fecha).localeCompare(String(b.fecha)) * signo;
  });
}

function vOrden(opciones, valor, tipo){
  var actual = opciones.filter(function(o){ return o.id === valor; })[0] || opciones[0];
  var h = '<div class="orden"><button class="btn" data-a="abrirOrden">' +
          '<span><span class="et">Ordenar: </span>' + esc(actual.label) + '</span>' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + TAN +
          '" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"' +
          (S.ordenAbierto ? ' style="transform:rotate(180deg)"' : '') +
          '><polyline points="6 9 12 15 18 9"/></svg></button>';
  if(S.ordenAbierto){
    h += '<div class="menu">';
    opciones.forEach(function(o){
      h += '<button class="' + (o.id===valor?'on':'') + '" data-a="orden" data-tipo="' + tipo +
           '" data-id="' + o.id + '">' + esc(o.label) + '</button>';

  }
  return h + '</div>';
}

function vPrenda(it, mostrarProv){
  var busy = !!S.guardando[it.codigo];
  var estado = it.estado || "";
  var h = '<div class="prenda' + (busy?' busy':'') + '">' +
    '<div class="fila"><div class="cod">' + esc(it.codigo) + '</div>' +
    '<span class="tag" style="background:' + colorEstado(estado) + '22;color:' + colorEstado(estado) + '">' +
    esc(estado || STOCK) + '</span></div>' +
    '<div class="prod">' + esc(it.producto) + '</div>';
  if(mostrarProv) h += '<div class="prov">' + esc(it.provNum) + ' — ' + esc(it.proveedor) + '</div>';
  if(it.fecha) h += '<div class="fecha">Ingresó ' + fechaCorta(it.fecha) + '</div>';
  if(it.nota && S.notaAbierta !== it.codigo) h += '<div class="nota">' + esc(it.nota) + '</div>';

  // Una prenda vendida no se toca desde acá: las ventas se cargan en la app de
  // ventas y dejarla editable permitiría "desvender" algo sin querer.
  if(estado === "Vendida"){
    return h + '<div class="nota" style="margin:0">Vendida. Se gestiona desde la app de ventas.</div></div>';
  }

  h += '<div class="estados">';
  ["Devuelta","Última Oportunidad","Revisar"].forEach(function(v){
    var on = estado === v, c = ESTADOS[v].color;
    h += '<button class="eb" data-a="' + (v==="Revisar"?"abrirNota":"marcar") + '" data-cod="' + esc(it.codigo) +
         '" data-fila="' + esc(it.fila) + '" data-estado="' + esc(v) + '" style="' +
         (on ? 'background:' + c + ';color:#fff;border:none' : 'color:' + c + ';border:1px solid ' + c + '55') +
         '">' + ESTADOS[v].label + '</button>';
  });
  h += '</div>';

  if(estado) h += '<button class="stock-btn" data-a="marcar" data-cod="' + esc(it.codigo) +
                  '" data-fila="' + esc(it.fila) + '" data-estado="' + STOCK + '">Volver a stock</button>';

  if(S.notaAbierta === it.codigo){
    h += '<div class="campo"><div class="titulo">¿Qué hay que revisar?</div>' +
         '<input id="notaInput" value="' + esc(S.notaTexto) +
         '" placeholder="Ej: no encuentro la prenda, tiene una mancha, código incorrecto…">' +
         '<div class="acciones">' +
         '<button class="guardar" data-a="guardarNota" data-cod="' + esc(it.codigo) + '" data-fila="' + esc(it.fila) + '">Guardar</button>' +
         '<button class="cancelar" data-a="cancelarNota">Cancelar</button></div></div>';
  }
  return h + '</div>';
}

function vElegirLugar(accion){
  accion = accion || "lugar";

  if(!S.bolsaMueble){
    S.ubicaciones.forEach(function(m){
      h += '<div class="card" data-a="mueble" data-m="' + esc(m.nombre) + '">' +
           '<div style="font-size:16px">' + esc(m.nombre) + '</div>' +

    });

    var m = S.ubicaciones.filter(function(x){ return x.nombre === S.bolsaMueble; })[0];
    h += '<p class="conteo">' + esc(S.bolsaMueble).toUpperCase() + '</p>';
    if(m) m.lugares.forEach(function(l){

function vListaEstado(vacioTexto, contenido){
  if(S.cargando) return '<div class="cargando">Cargando…</div>';

    '</div><button data-a="reintentar">Reintentar</button></div>';
  if(!contenido) return '<div class="vacio">' + esc(vacioTexto) + '</div>';
  return contenido;
}

  if(t.id === "bolsaNota"){ S.bolsaNotas = t.value; return; }
  if(t.id === "qProvB"){
    S.provBusq = t.value;
    if(timerProvB) clearTimeout(timerProvB);
    var qb = t.value;
    timerProvB = setTimeout(function(){ buscarProvParaBolsa(qb); }, 400);
    return;
  }
  if(t.id === "qDep"){
    S.depQuery = t.value;
    if(timerDep) clearTimeout(timerDep);
    var qd = t.value;
    timerDep = setTimeout(function(){ buscarDeposito(qd); }, 450);
    return;
  }
  if(t.id === "qCod"){
    S.codQuery = t.value;
    var q = t.value.trim();
    if(timerBusqueda) clearTimeout(timerBusqueda);
    if(q.length < 2){ S.resultados = []; S.buscando = false; refrescarCod(); return; }
    S.buscando = true; refrescarCod();
    var mio = ++busquedaId;
    timerBusqueda = setTimeout(function(){
      api("devolBuscar", {q:q}).then(function(r){
        if(mio !== busquedaId) return;
        S.resultados = r.prendas; S.buscando = false; refrescarCod();
      }).catch(function(){
        if(mio !== busquedaId) return;
        S.resultados = []; S.buscando = false; refrescarCod();
      });
    }, 450);
  }
});

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-a]");
  if(!el) {
    if(S.ordenAbierto){ S.ordenAbierto = false; render(); }
    return;
  }
  var a = el.getAttribute("data-a");

  if(a === "ir"){ ir(el.getAttribute("data-s")); return; }

  if(a === "atras"){
    if(S.screen === "itemsProv") ir("buscarProv");
    else if(S.screen === "lugar") ir("cargarMueble");
    else if(S.screen === "elegirProv") { S.screen = "lugar"; render(); }
    else if(S.screen === "elegirTipo"){
      if(S.origenCarga === "lugar"){ S.screen = "elegirProv"; render(); }
      else if(S.prov){ S.screen = "itemsProv"; render(); }
      else ir("deposito");
    }
    else if(S.screen === "elegirLugarNueva"){ S.screen = "elegirTipo"; render(); }
    else if(S.screen === "mapa" || S.screen === "mover" || S.screen === "cargarMueble") ir("deposito");
    else ir("home");
    return;
  }

  if(a === "abrirLugar"){
    S.origenCarga = "lugar";
    S.lugarSel = {mueble:el.getAttribute("data-m"), ubicacion:el.getAttribute("data-u")};
    cargarMapa("lugar");
    return;
  }

  if(a === "agregarAca"){
    S.origenCarga = "lugar";
    S.nueva = {prov:null, tipo:null, mueble:S.lugarSel.mueble, ubicacion:S.lugarSel.ubicacion};
    S.provBusq = ""; S.provLista = []; S.bolsaCantidad = "";
    S.screen = "elegirProv"; render();
    return;
  }

  if(a === "abrirBolsa" || a === "nuevaBolsa"){
    S.origenCarga = "prov";
    var num = el.getAttribute("data-num");
    var nom = el.getAttribute("data-nom") || (S.prov ? S.prov.nombre : num);
    S.nueva = {prov:{num:num, nombre:nom}, tipo:null, mueble:null, ubicacion:null};
    S.bolsaCantidad = "";
    S.screen = "elegirTipo"; render();
    return;
  }

  if(a === "elegiProv"){
    S.nueva.prov = {num:el.getAttribute("data-num"), nombre:el.getAttribute("data-nom")};
    S.screen = "elegirTipo"; render();
    return;
  }

  if(a === "elegiTipo"){
    S.nueva.tipo = el.getAttribute("data-t");
    if(S.nueva.ubicacion) crearBolsaNueva();
    else { S.bolsaMueble = null; cargarUbicaciones().then(function(){ S.screen = "elegirLugarNueva"; render(); }); }
    return;
  }

  if(a === "lugarNueva"){
    S.nueva.mueble = el.getAttribute("data-m");
    S.nueva.ubicacion = el.getAttribute("data-u");
    crearBolsaNueva();
    return;
  }

  if(a === "mueble"){ S.bolsaMueble = el.getAttribute("data-m") || null; render(); return; }

  if(a === "mover"){
    S.moverBolsa = el.getAttribute("data-nro"); S.bolsaMueble = null;
    cargarUbicaciones().then(function(){ S.screen = "mover"; render(); });
    return;
  }

  if(a === "lugarMover"){ moverBolsa(el.getAttribute("data-u"), el.getAttribute("data-m")); return; }

  if(a === "entregar"){ entregarBolsa(el.getAttribute("data-nro")); return; }
  if(a === "entregarTodo"){ entregarTodo(el.getAttribute("data-num"), el.getAttribute("data-nom")); return; }

  if(a === "yaAvise"){ yaAvise(el.getAttribute("data-num")); return; }

  if(a === "copiar" || a === "wa"){
    var n = el.getAttribute("data-num");
    var g = S.grupos.filter(function(x){ return String(x.num) === String(n); })[0];
    if(!g) return;
    if(a === "copiar") copiar(mensajeWa(g));
    else window.open("https://wa.me/" + g.wa + "?text=" + encodeURIComponent(mensajeWa(g)), "_blank");
    return;
  }

  if(a === "reintentar"){
    if(S.screen === "buscarProv") cargar("provs");
    else if(S.screen === "itemsProv") cargar("items");
    else if(S.screen === "pendientes") cargar("grupos");
    else if(S.screen === "revision") cargar("revisiones");
    return;
  }
});

document.addEventListener("keydown", function(ev){
  if(ev.key === "Enter" && ev.target.id === "notaInput"){
    var b = document.querySelector('[data-a="guardarNota"]');
    if(b) b.click();
  }
});

render();
cargarResumen();
</script>
